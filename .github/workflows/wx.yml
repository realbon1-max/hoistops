# Fetch the latest METAR/TAF for Japanese aerodromes and publish wx.json on the "wx" branch
# (one commit, force-pushed, so the history does not grow). The app reads it from raw.githubusercontent.com.
# GitHub の定時実行は混むと数時間遅れるため、1回の実行の中で10分ごとに取り続け（約5時間40分）、
# 次の実行（2時間ごとに予約・待ち行列で1つだけ待つ）に引き継ぐ。公開リポジトリなので実行時間は無料。
name: METAR/TAF
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wx
  cancel-in-progress: false
jobs:
  wx:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and publish every 10 minutes
        run: |
          end=$(( $(date +%s) + 340*60 ))
          git config --global user.name "hoistops-bot"
          git config --global user.email "actions@users.noreply.github.com"
          while :; do
            t0=$(date +%s)
            if python3 tools/fetch_wx.py /tmp/wx.json; then
              rm -rf /tmp/pub && mkdir /tmp/pub && cp /tmp/wx.json /tmp/pub/ && cd /tmp/pub && git init -q -b wx
              git add wx.json && git commit -qm "METAR/TAF $(date -u +%Y-%m-%dT%H:%MZ)"
              git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" wx || echo "push failed"
              cd "$GITHUB_WORKSPACE"
            else
              echo "fetch failed"
            fi
            next=$(( t0 + 600 )); [ $next -ge $end ] && break
            sleep $(( next - $(date +%s) > 0 ? next - $(date +%s) : 1 ))
          done
